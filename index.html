<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root {
      --black: #000000;
      --neon-green: #00FF88;
      --neon-pink: #FF00C8;
      --neon-blue: #3300FF;
      --spacing-8: 8px;
      --spacing-16: 16px;
      --spacing-24: 24px;
      --spacing-32: 32px;
      --spacing-48: 48px;
      --border-radius: 8px;
      --shadow: 0 12px 24px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--black);
      color: white;
      line-height: 1.6;
    }

    .nav {
      position: sticky;
      top: 0;
      background-color: var(--black);
      padding: var(--spacing-16);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .nav ul {
      list-style: none;
      display: flex;
      gap: var(--spacing-16);
    }

    .nav a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav a:hover {
      color: var(--neon-green);
    }

    .hero {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .hero canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      z-index: 1;
    }

    .hero p {
      font-size: 24px;
      z-index: 1;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--spacing-24);
      padding: var(--spacing-48);
    }

    .work-item {
      background-color: #111;
      padding: var(--spacing-16);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }

    .filter-btns {
      display: flex;
      gap: var(--spacing-16);
      padding: var(--spacing-24);
    }

    .filter-btn {
      background-color: #222;
      border: none;
      padding: var(--spacing-8) var(--spacing-16);
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .filter-btn.active {
      background-color: var(--neon-green);
      color: var(--black);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: var(--spacing-24);
      padding: var(--spacing-48);
    }

    .team-member {
      perspective: 1000px;
    }

    .team-member-card {
      position: relative;
      transition: transform 0.4s;
      transform-style: preserve-3d;
    }

    .team-member:hover .team-member-card {
      transform: rotateY(180deg);
    }

    .team-member-front, .team-member-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }

    .team-member-front {
      background-color: #111;
      padding: var(--spacing-16);
    }

    .team-member-back {
      background-color: #111;
      padding: var(--spacing-16);
      transform: rotateY(180deg);
    }

    .services {
      padding: var(--spacing-48);
    }

    .service {
      margin-bottom: var(--spacing-24);
    }

    .counter {
      font-size: 24px;
      font-weight: 600;
    }

    .contact {
      padding: var(--spacing-48);
      text-align: center;
    }

    .contact-info {
      margin-bottom: var(--spacing-32);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: var(--spacing-16);
    }

    .social-link {
      color: white;
      transition: transform 0.3s;
    }

    .social-link:hover {
      transform: scale(1.2);
    }

    .form-container {
      display: none;
      padding: var(--spacing-24);
      background-color: #111;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: var(--spacing-16);
    }

    .form-input {
      width: 100%;
      padding: var(--spacing-8);
      border: none;
      border-radius: var(--border-radius);
      background-color: #222;
      color: white;
    }

    .form-btn {
      background-color: var(--neon-green);
      color: var(--black);
      border: none;
      padding: var(--spacing-8) var(--spacing-16);
      border-radius: var(--border-radius);
      cursor: pointer;
    }

    .toast-container {
      position: fixed;
      bottom: var(--spacing-16);
      right: var(--spacing-16);
      z-index: 1000;
    }

    .toast {
      background-color: var(--neon-green);
      color: var(--black);
      padding: var(--spacing-8) var(--spacing-16);
      border-radius: var(--border-radius);
      margin-bottom: var(--spacing-8);
      box-shadow: var(--shadow);
    }

    .toast.error {
      background-color: #ff3333;
    }

    @media (max-width: 768px) {
      .work-grid, .team-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="#">Creative Agency</a>
    <ul>
      <li><a href="#work">Work</a></li>
      <li><a href="#team">Team</a></li>
      <li><a href="#services with "><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    <canvas id="hero-canvas"></canvas>
    <h1>Unleashing Creative Potential</h1>
    <p>Your vision, our expertise</p>
  </section>

  <section id="work">
    <div class="filter-btns">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="branding">Branding</button>
      <button class="filter-btn" data-filter="web">Web</button>
      <button class="filter-btn" data-filter="print">Print</button>
    </div>
    <div class="work-grid">
      <!-- Projects will be generated here -->
    </div>
  </section>

  <section id="team">
    <div class="team-grid">
      <!-- Team members will be generated here -->
    </div>
  </section>

  <section id="services" class="services">
    <!-- Services will be generated here -->
  </section>

  <section id="contact" class="contact">
    <h2>Get in Touch</h2>
    <div class="contact-info">
      <p><a href="mailto:info@creativeagency.com">info@creativeagency.com</a></p>
      <p>+1 123 456 7890</p>
    </div>
    <div class="social-links">
      <a href="#" class="social-link"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#" class="social-link"><i class="fa-brands fa-twitter"></i></a>
      <a href="#" class="social-link"><i class="fa-brands fa-instagram"></i></a>
      <a href="#" class="social-link"><i class="fa-brands fa-linkedin-in"></i></a>
    </div>
    <button id="contact-btn">Contact Us</button>
    <div class="form-container" id="contact-form">
      <form id="contact-form-el">
        <div class="form-group">
          <input type="text" class="form-input" placeholder="Name" required>
        </div>
        <div class="form-group">
          <input type="email" class="form-input" placeholder="Email" required>
        </div>
        <div class="form-group">
          <textarea class="form-input" placeholder="Message" required></textarea>
        </div>
        <button type="submit" class="form-btn">Send</button>
      </form>
    </div>
  </section>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
  <script>
    // Hero canvas animation
    const canvas = document.getElementById('hero-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    for (let i = 0; i < 200; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: Math.random() * 0.5 - 0.25,
        vy: Math.random() * 0.5 - 0.25,
        color: ['#00FF88', '#FF00C8', '#3300FF'][Math.floor(Math.random() * 3)]
      });
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Filterable grid
    const projects = [
      { category: 'branding', title: 'Project 1' },
      { category: 'web', title: 'Project 2' },
      { category: 'print', title: 'Project 3' },
      // Add more projects here
    ];

    const workGrid = document.querySelector('.work-grid');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderProjects(category = 'all') {
      workGrid.innerHTML = '';
      const filteredProjects = category === 'all' ? projects : projects.filter(p => p.category === category);
      filteredProjects.forEach((project, index) => {
        const item = document.createElement('div');
        item.classList.add('work-item');
        item.innerHTML = `<h3>${project.title}</h3>`;
        workGrid.appendChild(item);
      });
      gsap.from('.work-item', { opacity: 0, y: 20, stagger: 0.1, duration: 0.5 });
    }

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProjects(btn.dataset.filter);
      });
    });

    renderProjects();

    // Team members
    const teamGrid = document.querySelector('.team-grid');
    const teamMembers = [
      { name: 'John Doe', role: 'Designer', bio: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' },
      // Add more team members here
    ];

    teamMembers.forEach(member => {
      const memberEl = document.createElement('div');
      memberEl.classList.add('team-member');
      memberEl.innerHTML = `
        <div class="team-member-card">
          <div class="team-member-front">
            <h3>${member.name}</h3>
            <p>${member.role}</p>
          </div>
          <div class="team-member-back">
            <p>${member.bio}</p>
          </div>
        </div>
      `;
      teamGrid.appendChild(memberEl);
    });

    // Services
    const servicesSection = document.querySelector('.services');
    const services = [
      { title: 'Web Development', value: 95 },
      // Add more services here
    ];

    services.forEach(service => {
      const serviceEl = document.createElement('div');
      serviceEl.classList.add('service');
      serviceEl.innerHTML = `
        <h3>${service.title}</h3>
        <p class="counter" data-value="${service.value}">0%</p>
      `;
      servicesSection.appendChild(serviceEl);
    });

    // Animated counters
    const counters = document.querySelectorAll('.counter');
    counters.forEach(counter => {
      anime({
        targets: counter,
        textContent: [0, counter.dataset.value],
        round: 1,
        easing: 'spring(1, 80, 10, 0)',
        duration: 2000
      });
    });

    // Contact form
    const contactBtn = document.getElementById('contact-btn');
    const formContainer = document.getElementById('contact-form');
    const form = document.getElementById('contact-form-el');

    contactBtn.addEventListener('click', () => {
      formContainer.style.display = 'block';
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      // Form submission logic here
      showToast('Message sent successfully!', 'success');
    });

    // Toast notifications
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.classList.add('toast');
      if (type === 'error') toast.classList.add('error');
      toast.textContent = message;
      document.getElementById('toast-container').appendChild(toast);
      gsap.to(toast, { x: 0, duration: 0.5, ease: 'power2.out' });
      setTimeout(() => {
        gsap.to(toast, { x: '100%', duration: 0.5, ease: 'power2.out', onComplete: () => toast.remove() });
      }, 3000);
    }
  </script>
</body>
</html>
```
